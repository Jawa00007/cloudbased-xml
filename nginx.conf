# Rate limiting zones — must be in http context (nginx reads conf.d into http {})
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:1m  rate=5r/m;

# ── HTTP: ACME challenge only; redirect everything else to HTTPS ───────────────
server {
    listen 80;
    server_name forecast.dinamoservice.it;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: full application ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name forecast.dinamoservice.it;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/forecast.dinamoservice.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forecast.dinamoservice.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Request size and timeout limits
    client_max_body_size  25m;
    client_body_timeout   15s;
    client_header_timeout 10s;

    # Security headers
    add_header X-Content-Type-Options        "nosniff"                              always;
    add_header X-Frame-Options               "DENY"                                 always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
    add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains"  always;
    add_header X-XSS-Protection             "1; mode=block"                        always;

    # Adminer — rate-limited, basic-auth protected
    location /adminer/ {
        limit_req zone=auth_limit burst=5 nodelay;
        auth_basic           "SII Database Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass           http://adminer:8080/;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
    }

    # Auth endpoint — strict rate limit to block brute-force
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass         http://api:8000/api/auth/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # FastAPI — general rate limit
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React SPA
    location / {
        root  /var/www/html;
        try_files $uri /index.html;
    }
}
