server {
    listen 80;
    server_name forecast.dinamoservice.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name forecast.dinamoservice.it;

    ssl_certificate     /etc/letsencrypt/live/forecast.dinamoservice.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forecast.dinamoservice.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /adminer/ {
        auth_basic           "SII Database Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass           http://adminer:8080/;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root  /var/www/html;
        try_files $uri /index.html;
    }
}
