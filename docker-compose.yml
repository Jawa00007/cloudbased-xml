services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    command: >
      postgres
        -c shared_buffers=768MB
        -c effective_cache_size=2GB
        -c work_mem=32MB
        -c maintenance_work_mem=256MB
        -c synchronous_commit=off
        -c max_wal_size=2GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=64MB
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sii}
      POSTGRES_USER:     ${POSTGRES_USER:-sii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/volume_fra1_quanta/pgdata:/var/lib/postgresql/data
    networks:
      internal:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sii -d sii"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      internal:
        ipv4_address: 172.20.0.11
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping', timeout=3)\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2.0"

  # Hot-standby replica — nginx routes here only when api is unhealthy/down
  api2:
    build: .
    restart: unless-stopped
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      internal:
        ipv4_address: 172.20.0.20
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping', timeout=3)\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2.5g
          cpus: "2.0"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./frontend/dist:/var/www/html:ro
      - ./frontend/dist-staging:/var/www/staging:ro
    depends_on:
      - api
      - adminer
    networks:
      internal:
        ipv4_address: 172.20.0.12
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    networks:
      internal:
        ipv4_address: 172.20.0.13
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

networks:
  internal:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  certbot_webroot:
