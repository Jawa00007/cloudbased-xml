services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sii}
      POSTGRES_USER:     ${POSTGRES_USER:-sii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      internal:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sii -d sii"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    networks:
      internal:
        ipv4_address: 172.20.0.11
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./frontend/dist:/var/www/html:ro
    depends_on:
      - api
      - adminer
    networks:
      internal:
        ipv4_address: 172.20.0.12
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    networks:
      internal:
        ipv4_address: 172.20.0.13
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

networks:
  internal:
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  pgdata:
  certbot_webroot:
