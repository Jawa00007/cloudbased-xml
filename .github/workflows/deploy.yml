name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/sii
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose build api api2
              docker compose up -d --no-deps api api2
              echo "=== Production API deployed ==="
            else
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                build staging-api
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                up -d --no-deps staging-api
              echo "=== Staging API deployed ==="
            fi

      - name: Upload frontend (production)
        if: github.ref_name == 'main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "frontend/dist/"
          target: "/opt/sii/frontend/dist/"
          strip_components: 2
          overwrite: true

      - name: Upload frontend (staging)
        if: github.ref_name == 'staging'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "frontend/dist/"
          target: "/opt/sii/frontend/dist-staging/"
          strip_components: 2
          overwrite: true

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: docker exec sii-nginx-1 nginx -s reload

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sleep 8
            if [ "${{ github.ref_name }}" = "main" ]; then
              curl -sfk https://localhost/api/health | python3 -c \
                "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status']=='ok' else 1)"
            else
              curl -sf http://localhost:8080/api/health | python3 -c \
                "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status']=='ok' else 1)"
            fi
