name: Deploy

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/sii
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            if [ "${{ github.ref_name }}" = "main" ]; then
              docker compose build api api2

              # Rolling restart: bring up api2 first, wait for it to be healthy,
              # then restart api1 — ensures nginx always has one healthy backend.
              docker compose up -d --no-deps api2
              echo "Waiting for api2 to become healthy..."
              for i in $(seq 1 15); do
                if curl -s http://172.20.0.20:8000/api/ping | grep -q '"ok"'; then
                  echo "api2 healthy after ${i}x5s"
                  break
                fi
                sleep 5
              done

              docker compose up -d --no-deps api
              echo "=== Production API deployed (rolling) ==="
            else
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                build staging-api
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                up -d --no-deps staging-api
              echo "=== Staging API deployed ==="
            fi

      - name: Upload frontend (production)
        if: github.ref_name == 'main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "frontend/dist/"
          target: "/opt/sii/frontend/dist/"
          strip_components: 2
          overwrite: true

      - name: Upload frontend (staging)
        if: github.ref_name == 'staging'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "frontend/dist/"
          target: "/opt/sii/frontend/dist-staging/"
          strip_components: 2
          overwrite: true

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: docker exec sii-nginx-1 nginx -s reload

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sleep 20
            for i in 1 2 3 4 5; do
              if [ "${{ github.ref_name }}" = "main" ]; then
                result=$(curl -sfk --max-time 10 https://localhost/api/health 2>/dev/null)
              else
                result=$(curl -sf --max-time 10 http://localhost:8080/api/health 2>/dev/null)
              fi
              if echo "$result" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status'] in ('ok','degraded') else 1)" 2>/dev/null; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              echo "Health check attempt $i failed, retrying in 15s..."
              sleep 15
            done
            echo "Health check failed after 5 attempts"
            exit 1
