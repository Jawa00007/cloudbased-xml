# Monitoring overlay — run alongside the main stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# First-time setup:
#   1. Add GRAFANA_PASSWORD to /opt/sii/.env on the server
#   2. Add grafana credentials to .htpasswd:
#      htpasswd -nb monitoring <yourpassword> >> /opt/sii/.htpasswd
#   3. After starting: open https://forecast.dinamoservice.it/grafana/
#      Default dashboard (SII Platform) is auto-provisioned.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change_me_before_deploy}
      GF_SERVER_ROOT_URL: https://forecast.dinamoservice.it/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  internal:
    external: true
    name: sii_internal

volumes:
  prometheus_data:
  grafana_data:
